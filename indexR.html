<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Chuyển Đổi Số 2026</title>
    <script src="data.js"></script>
    <style>
        :root { --primary: #2563eb; --success: #22c55e; --error: #ef4444; --bg: #f1f5f9; --text: #1e293b; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .quiz-card { background: white; width: 100%; max-width: 800px; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); height: fit-content; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .topic-badge { background: #eff6ff; color: #1e40af; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; border: 1px solid #dbeafe; }
        .score-box { font-weight: 800; font-size: 1.1rem; }
        .progress-container { height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 25px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }
        .q-id { color: var(--primary); font-weight: 800; margin-right: 8px; border-bottom: 2px solid var(--primary); }
        .question-text { font-size: 1.3rem; font-weight: 700; line-height: 1.5; margin-bottom: 25px; color: #0f172a; }
        .options-grid { display: grid; gap: 12px; }
        .option { display: flex; align-items: flex-start; padding: 16px 20px; border: 2px solid #f1f5f9; border-radius: 12px; background: white; cursor: pointer; transition: 0.2s; font-size: 1rem; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { border-color: var(--primary); background: #f0f7ff; }
        .option b { min-width: 25px; color: var(--primary); margin-right: 10px; }
        .option.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: 600; }
        .option.wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #b91c1c !important; }
        
        /* Tùy chỉnh phần thông báo trạng thái và giải thích */
        .explanation-container { margin-top: 20px; display: none; animation: slideDown 0.3s ease-out; }
        .status-msg { color: #1e40af; font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; display: block; }
        .explanation-content { padding: 1.2rem; background: #fffbeb; border-left: 5px solid #f59e0b; border-radius: 8px; line-height: 1.6; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .controls { margin-top: 30px; display: flex; justify-content: center; }
        #next-btn { background: var(--primary); color: white; border: none; padding: 14px 40px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <div id="topic" class="topic-badge">CHỦ ĐỀ: ...</div>
        <div class="score-box">
            <span style="color:var(--success)">✓ <span id="correct-count">0</span></span> &nbsp;
            <span style="color:var(--error)">✗ <span id="wrong-count">0</span></span>
        </div>
    </div>
    
    <div class="progress-container"><div class="progress-bar" id="progress"></div></div>

    <div id="quiz-content">
        <div class="question-text">
            <span id="q-number" class="q-id"></span>
            <span id="question">Đang tải câu hỏi...</span>
        </div>
        
        <div id="options" class="options-grid"></div>
        
        <!-- Phần chứa trạng thái và ghi chú -->
        <div id="explanation-container" class="explanation-container">
            <span class="status-msg">✨ Đã trả lời xong!</span>
            <div id="note-box" class="explanation-content"></div>
        </div>
        
        <div class="controls">
            <button id="next-btn" onclick="loadNewQuestion()">Câu tiếp theo ➔</button>
        </div>
    </div>
</div>

<script>
    let correctScore = 0;
    let wrongScore = 0;
    let currentQuestion = null;

    function initQuiz() {
        if (typeof questionsData !== 'undefined' && questionsData.length > 0) {
            loadNewQuestion();
        } else {
            document.getElementById('question').innerHTML = "<span style='color:red'>Lỗi: Không tìm thấy biến 'questionsData' trong data.js!</span>";
        }
    }

    function loadNewQuestion() {
        document.getElementById('explanation-container').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        
        currentQuestion = questionsData[Math.floor(Math.random() * questionsData.length)];
        
        document.getElementById('q-number').innerText = "Câu " + currentQuestion.id + ":";
        document.getElementById('topic').innerText = "CHỦ ĐỀ: " + (currentQuestion.topic_name || "Chung");
        document.getElementById('question').innerText = currentQuestion.question;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        Object.keys(currentQuestion.options).forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerHTML = `<b>${key}.</b> <span>${currentQuestion.options[key]}</span>`;
            btn.onclick = () => checkAnswer(btn, key);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedKey) {
        const allOptionBtns = document.querySelectorAll('.option');
        allOptionBtns.forEach(btn => btn.disabled = true);

        const correctKey = currentQuestion.answer;

        if (selectedKey === correctKey) {
            selectedBtn.classList.add('correct');
            correctScore++;
        } else {
            selectedBtn.classList.add('wrong');
            allOptionBtns.forEach(btn => {
                if (btn.querySelector('b').innerText.startsWith(correctKey)) {
                    btn.classList.add('correct');
                }
            });
            wrongScore++;
        }
        
        document.getElementById('correct-count').innerText = correctScore;
        document.getElementById('wrong-count').innerText = wrongScore;

        // HIỂN THỊ TRẠNG THÁI VÀ GHI CHÚ
        const container = document.getElementById('explanation-container');
        const noteBox = document.getElementById('note-box');
        
        container.style.display = 'block';
        
        // Luôn ưu tiên hiển thị nội dung giải thích từ file data.js
        if (currentQuestion.note && currentQuestion.note.trim() !== "") {
            noteBox.innerHTML = `<strong>Giải thích:</strong> ${currentQuestion.note}`;
        } else {
            noteBox.innerHTML = `Chúc mừng bạn đã hoàn thành câu hỏi này!`;
        }

        document.getElementById('next-btn').style.display = 'block';
        updateProgressBar();
    }

    function updateProgressBar() {
        const totalDone = correctScore + wrongScore;
        const progress = (totalDone / 400) * 100;
        document.getElementById('progress').style.width = Math.min(progress, 100) + '%';
    }

    initQuiz();
</script>

</body>
</html>
