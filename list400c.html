<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập 400 Câu - Tùy Chỉnh Linh Hoạt</title>
    <script src="data.js"></script>
    <style>
        :root { --primary: #2563eb; --success: #166534; --error: #991b1b; --bg: #f1f5f9; --text: #1e293b; --sidebar-w: 280px; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* HEADER */
        .header-stats { position: fixed; top: 0; left: 0; right: 0; height: 65px; background: white; z-index: 2000; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); gap: 10px; }
        
        .options-group { display: flex; flex-direction: column; gap: 4px; }
        .switch-item { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 700; color: #64748b; white-space: nowrap; }

        /* Switch CSS */
        .switch { position: relative; display: inline-block; width: 30px; height: 16px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(14px); }

        .progress-wrapper { flex: 1; min-width: 100px; }
        .progress-container { height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 3px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.5s; }
        
        .score-box { background: var(--primary); color: white; padding: 6px 10px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; text-align: center; line-height: 1.2; }

        .toggle-btn { position: fixed; top: 75px; left: 15px; z-index: 1000; background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* SIDEBAR */
        .sidebar { width: var(--sidebar-w); background: white; border-right: 2px solid #e2e8f0; display: flex; flex-direction: column; padding: 130px 15px 15px 15px; transition: all 0.3s ease; position: relative; flex-shrink: 0; }
        .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w) - 30px); }
        .search-input { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; margin-bottom: 15px; }
        .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; overflow-y: auto; flex: 1; }
        .nav-item { display: flex; align-items: center; justify-content: center; height: 35px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; text-decoration: none; color: #64748b; font-size: 0.8rem; font-weight: 600; }
        .nav-item.correct { background: #dcfce7; color: #166534; border-color: #22c55e; }
        .nav-item.wrong { background: #fee2e2; color: #991b1b; border-color: #f87171; }
        .nav-item.hidden-force { display: none !important; }

        /* MAIN */
        .main-content { flex: 1; overflow-y: auto; padding: 90px 30px 30px 30px; background: #fff; scroll-behavior: smooth; }
        .question-item { border-bottom: 2px solid #f1f5f9; padding: 40px 0; scroll-margin-top: 80px; transition: opacity 0.3s; }
        .question-item.hidden-force { display: none !important; }
        .question-header { font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; color: #0f172a; line-height: 1.5; }
        .q-id-text { color: var(--primary); margin-right: 5px; border-bottom: 2px solid var(--primary); }

        .option-line { padding: 14px 15px; border-radius: 12px; margin: 10px 0; border: 2px solid #f1f5f9; cursor: pointer; transition: 0.1s; line-height: 1.4; }
        .option-line:hover:not(.disabled) { border-color: var(--primary); background: #f0f7ff; }
        .option-line.correct { background-color: #dcfce7; color: #166534; border-color: #22c55e; font-weight: 600; }
        .option-line.wrong { background-color: #fee2e2; color: #991b1b; border-color: #ef4444; font-weight: 600; }
        .option-line.disabled { cursor: default; }

        .note-box { background: #fefce8; border-left: 4px solid #facc15; padding: 15px; margin-top: 15px; font-size: 0.95rem; display: none; }
        
        .action-btn { width: 100%; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; font-weight: 700; border: 1px solid transparent; margin-bottom: 6px; }
        .btn-reset-wrong { background: #fff7ed; border-color: #fb923c; color: #c2410c; }
        .btn-reset-all { background: #fee2e2; border-color: #f87171; color: #991b1b; }

        @media (max-width: 600px) {
            .sidebar { position: fixed; z-index: 999; height: 100%; padding-top: 130px; }
            .sidebar.collapsed { margin-left: -320px; }
            .header-stats { padding: 0 10px; }
        }
    </style>
</head>
<body>

    <div class="header-stats">
        <div class="options-group">
            <div class="switch-item">
                <label class="switch">
                    <input type="checkbox" id="hide-correct-toggle" onchange="applyFilters()">
                    <span class="slider"></span>
                </label>
                <span>ẨN CÂU ĐÚNG</span>
            </div>
            <div class="switch-item">
                <label class="switch">
                    <input type="checkbox" id="auto-scroll-toggle" checked onchange="saveScrollPref()">
                    <span class="slider"></span>
                </label>
                <span>TỰ CUỘN</span>
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-container"><div id="progress-bar" class="progress-fill"></div></div>
            <div style="font-size: 0.7rem; font-weight: 800; color: var(--primary); text-align: center;">TIẾN ĐỘ: <span id="perc">0%</span></div>
        </div>

        <div id="score-display" class="score-box">Đúng: 0<br>Làm: 0</div>
    </div>

    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="sidebar">
        <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm..." onkeyup="applyFilters()">
        <button class="action-btn btn-reset-wrong" onclick="resetWrongOnly()">⚠️ Làm lại câu SAI</button>
        <button class="action-btn btn-reset-all" onclick="resetAll()">❌ Xóa SẠCH</button>
        <div class="nav-grid" id="nav-grid"></div>
    </div>

    <div class="main-content" id="main-content">
        <div id="questions-container"></div>
    </div>

<script>
    let userProgress = JSON.parse(localStorage.getItem('user_exam_progress') || "{}");
    const sortedData = [...questionsData].sort((a, b) => a.id - b.id);

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

    function init() {
        // Khôi phục tùy chọn tự cuộn
        const savedScroll = localStorage.getItem('scroll_pref');
        if (savedScroll !== null) document.getElementById('auto-scroll-toggle').checked = (savedScroll === 'true');

        const navGrid = document.getElementById('nav-grid');
        const qContainer = document.getElementById('questions-container');
        let navHtml = '', qHtml = '';

        sortedData.forEach((q) => {
            const res = userProgress[q.id];
            const navStatus = res ? (res.isCorrect ? 'correct' : 'wrong') : '';
            navHtml += `<a href="#cau-${q.id}" class="nav-item ${navStatus}" id="nav-${q.id}" onclick="handleNavClick()">${q.id}</a>`;

            let optHtml = '';
            Object.keys(q.options).forEach(key => {
                let state = '';
                if (res) {
                    if (key === q.answer) state = 'correct';
                    else if (key === res.selected && !res.isCorrect) state = 'wrong';
                    else state = 'disabled';
                }
                optHtml += `<div class="option-line ${state} ${res ? 'disabled' : ''}" onclick="selectOption(${q.id}, '${key}', '${q.answer}')" data-key="${key}"><b>${key}.</b> ${q.options[key]}</div>`;
            });

            qHtml += `
                <div class="question-item" id="cau-${q.id}" data-id="${q.id}" data-text="${q.id} ${q.question.toLowerCase()}">
                    <div class="question-header"><span class="q-id-text">#${q.id}</span> ${q.question}</div>
                    <div class="options-list">${optHtml}</div>
                    <div class="note-box" id="note-${q.id}" style="${res ? 'display:block' : ''}">💡 <b>Giải thích:</b> ${q.note || "Đáp án chính xác."}</div>
                </div>`;
        });
        navGrid.innerHTML = navHtml; qContainer.innerHTML = qHtml;
        updateScoreBoard();
        applyFilters();
    }

    function saveScrollPref() {
        localStorage.setItem('scroll_pref', document.getElementById('auto-scroll-toggle').checked);
    }

    function selectOption(qId, selectedKey, correctKey) {
        if (userProgress[qId]) return;
        const isCorrect = (selectedKey === correctKey);
        userProgress[qId] = { selected: selectedKey, isCorrect: isCorrect };
        localStorage.setItem('user_exam_progress', JSON.stringify(userProgress));

        const qItem = document.getElementById(`cau-${qId}`);
        const navItem = document.getElementById(`nav-${qId}`);
        const options = qItem.querySelectorAll('.option-line');
        
        options.forEach(opt => {
            opt.classList.add('disabled');
            const key = opt.getAttribute('data-key');
            if (key === correctKey) opt.classList.add('correct');
            else if (key === selectedKey && !isCorrect) opt.classList.add('wrong');
        });

        navItem.classList.add(isCorrect ? 'correct' : 'wrong');
        document.getElementById(`note-${qId}`).style.display = 'block';
        updateScoreBoard();

        // Xử lý ẩn và cuộn
        const isHideCorrect = document.getElementById('hide-correct-toggle').checked;
        const isAutoScroll = document.getElementById('auto-scroll-toggle').checked;

        if (isCorrect && isHideCorrect) {
            setTimeout(() => {
                qItem.style.opacity = '0';
                setTimeout(() => { 
                    qItem.classList.add('hidden-force');
                    navItem.classList.add('hidden-force');
                    if(isAutoScroll) scrollToNext();
                }, 300);
            }, 800);
        } else {
            if(isAutoScroll) setTimeout(scrollToNext, 800);
        }
    }

    function scrollToNext() {
        const nextTarget = sortedData.find(q => !userProgress[q.id]);
        if (nextTarget) {
            const el = document.getElementById(`cau-${nextTarget.id}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function applyFilters() {
        const searchText = document.getElementById('search-input').value.toLowerCase();
        const hideCorrect = document.getElementById('hide-correct-toggle').checked;

        sortedData.forEach(q => {
            const res = userProgress[q.id];
            const qEl = document.getElementById(`cau-${q.id}`);
            const navEl = document.getElementById(`nav-${q.id}`);
            const matchSearch = (`${q.id} ${q.question.toLowerCase()}`).includes(searchText);
            const shouldHide = hideCorrect && res && res.isCorrect;

            if (matchSearch && !shouldHide) {
                qEl.classList.remove('hidden-force');
                navEl.classList.remove('hidden-force');
                qEl.style.opacity = '1';
            } else {
                qEl.classList.add('hidden-force');
                navEl.classList.add('hidden-force');
            }
        });
    }

    function updateScoreBoard() {
        const attempted = Object.keys(userProgress).length;
        const correct = Object.values(userProgress).filter(v => v.isCorrect).length;
        document.getElementById('score-display').innerHTML = `Đúng: ${correct}<br>Làm: ${attempted}`;
        const percent = Math.round((attempted / sortedData.length) * 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('perc').innerText = percent + '%';
    }

    function resetWrongOnly() {
        let count = 0; const newProgress = {};
        for (const [id, data] of Object.entries(userProgress)) { if (data.isCorrect) newProgress[id] = data; else count++; }
        if (count > 0 && confirm(`Làm lại ${count} câu SAI?`)) {
            userProgress = newProgress; localStorage.setItem('user_exam_progress', JSON.stringify(userProgress));
            location.reload();
        }
    }

    function resetAll() { if (confirm("Xóa SẠCH kết quả?")) { localStorage.removeItem('user_exam_progress'); location.reload(); } }
    function handleNavClick() { if (window.innerWidth <= 600) toggleSidebar(); }
    window.onload = init;
</script>
</body>
</html>
