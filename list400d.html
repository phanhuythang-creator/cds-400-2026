<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập 400 Câu - Siêu Cấp Regex</title>
    <script src="data.js"></script>
    <style>
        :root { --primary: #2563eb; --success: #166534; --error: #991b1b; --bg: #f1f5f9; --text: #1e293b; --sidebar-w: 280px; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* HEADER */
        .header-stats { position: fixed; top: 0; left: 0; right: 0; height: 65px; background: white; z-index: 2000; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); gap: 10px; }
        .options-group { display: flex; flex-direction: column; gap: 4px; }
        .switch-item { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 700; color: #64748b; }
        .switch { position: relative; display: inline-block; width: 30px; height: 16px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(14px); }

        .progress-wrapper { flex: 1; min-width: 100px; }
        .progress-container { height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 3px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.5s; }
        .score-box { background: var(--primary); color: white; padding: 6px 10px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; text-align: center; line-height: 1.2; }

        /* SIDEBAR */
        .toggle-btn { position: fixed; top: 75px; left: 15px; z-index: 1000; background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .sidebar { width: var(--sidebar-w); background: white; border-right: 2px solid #e2e8f0; display: flex; flex-direction: column; padding: 130px 15px 15px 15px; transition: 0.3s; flex-shrink: 0; }
        .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w) - 30px); }
        
        .search-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; margin-bottom: 15px; font-size: 0.9rem; }
        .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; overflow-y: auto; flex: 1; }
        .nav-item { display: flex; align-items: center; justify-content: center; height: 35px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; text-decoration: none; color: #64748b; font-size: 0.8rem; font-weight: 600; }
        .nav-item.correct { background: #dcfce7; color: #166534; border-color: #22c55e; }
        .nav-item.wrong { background: #fee2e2; color: #991b1b; border-color: #f87171; }
        .nav-item.hidden-force { display: none !important; }

        /* CONTENT */
        .main-content { flex: 1; overflow-y: auto; padding: 90px 30px 30px 30px; background: #fff; scroll-behavior: smooth; }
        .question-item { border-bottom: 2px solid #f1f5f9; padding: 40px 0; scroll-margin-top: 80px; transition: opacity 0.3s; }
        .question-item.hidden-force { display: none !important; }
        .question-header { font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; color: #0f172a; line-height: 1.5; }
        .q-id-text { color: var(--primary); margin-right: 5px; border-bottom: 2px solid var(--primary); }
        
        /* HIGHLIGHT */
        mark { background: #fef08a; color: #854d0e; padding: 0 1px; border-radius: 2px; font-weight: bold; }

        .option-line { padding: 14px 15px; border-radius: 12px; margin: 10px 0; border: 2px solid #f1f5f9; cursor: pointer; transition: 0.1s; line-height: 1.4; }
        .option-line.correct { background-color: #dcfce7; color: #166534; border-color: #22c55e; font-weight: 600; }
        .option-line.wrong { background-color: #fee2e2; color: #991b1b; border-color: #ef4444; font-weight: 600; }
        .option-line.disabled { cursor: default; }
        .note-box { background: #fefce8; border-left: 4px solid #facc15; padding: 15px; margin-top: 15px; font-size: 0.95rem; display: none; }
        
        .action-btn { width: 100%; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.75rem; font-weight: 700; border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 8px;}
        .btn-reset-wrong { background: #fff7ed; border-color: #fb923c; color: #c2410c; }
        .btn-reset-all { background: #fee2e2; border-color: #f87171; color: #991b1b; }

        @media (max-width: 600px) { .sidebar { position: fixed; z-index: 999; height: 100%; padding-top: 130px; } .sidebar.collapsed { margin-left: -320px; } }
    </style>
</head>
<body>
    <div class="header-stats">
        <div class="options-group">
            <div class="switch-item"><label class="switch"><input type="checkbox" id="hide-correct-toggle" onchange="applyFilters()"><span class="slider"></span></label><span>ẨN CÂU ĐÚNG</span></div>
            <div class="switch-item"><label class="switch"><input type="checkbox" id="auto-scroll-toggle" checked><span class="slider"></span></label><span>TỰ CUỘN</span></div>
        </div>
        <div class="progress-wrapper">
            <div class="progress-container"><div id="progress-bar" class="progress-fill"></div></div>
            <div style="font-size: 0.7rem; font-weight: 800; color: var(--primary); text-align: center;">TIẾN ĐỘ: <span id="perc">0%</span></div>
        </div>
        <div id="score-display" class="score-box">0 / 0</div>
    </div>

    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="sidebar">
        <input type="text" id="search-input" class="search-input" placeholder="Tìm 'phong' hoặc Regex..." onkeyup="applyFilters()">
        <div class="btn-group">
            <button class="action-btn btn-reset-wrong" onclick="resetWrongOnly()">⚠️ Làm lại câu SAI</button>
            <button class="action-btn btn-reset-all" onclick="resetAll()">❌ Xóa SẠCH</button>
        </div>
        <div class="nav-grid" id="nav-grid"></div>
    </div>

    <div class="main-content" id="main-content"><div id="questions-container"></div></div>

<script>
    let userProgress = JSON.parse(localStorage.getItem('user_exam_progress_d') || "{}");
    const sortedData = [...questionsData].sort((a, b) => a.id - b.id);

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

    function removeAccents(str) {
        if (!str) return "";
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, m => m.toLowerCase() === 'đ' ? 'd' : 'D').toLowerCase();
    }

    // HÀM QUAN TRỌNG NHẤT: Biến đổi chuỗi nhập vào thành Regex có thể Highlight cả có dấu
    function getRegexForHighlight(input) {
        const charMap = {
            'a': '[aàáảãạâầấẩẫậăằắẳẵặ]', 'e': '[eèéẻẽẹêềếểễệ]', 'i': '[iìíỉĩị]',
            'o': '[oòóỏõọôồốổỗộơờớởỡợ]', 'u': '[uùúủũụưừứửữự]', 'y': '[yỳýỷỹỵ]', 'd': '[dđ]'
        };
        let pattern = "";
        for (let i = 0; i < input.length; i++) {
            let c = input[i].toLowerCase();
            // Nếu là ký tự điều khiển Regex, giữ nguyên
            if (['|', '^', '$', '*', '+', '?', '.', '(', ')', '[', ']', '{', '}'].includes(c)) pattern += c;
            // Nếu là \d, \w... bảo vệ nó
            else if (c === '\\' && i + 1 < input.length) { pattern += c + input[i+1]; i++; }
            // Nếu là chữ cái thường, biến thành cụm fuzzy
            else pattern += charMap[c] || c;
        }
        return new RegExp(`(${pattern})`, 'gi');
    }

    function init() {
        const qContainer = document.getElementById('questions-container');
        const navGrid = document.getElementById('nav-grid');
        let navHtml = '', qHtml = '';
        sortedData.forEach((q) => {
            const res = userProgress[q.id];
            navHtml += `<a href="#cau-${q.id}" class="nav-item ${res?(res.isCorrect?'correct':'wrong'):''}" id="nav-${q.id}" onclick="handleNavClick()">${q.id}</a>`;
            let optHtml = '';
            Object.keys(q.options).forEach(k => {
                let s = res ? (k===q.answer?'correct':(k===res.selected?'wrong':'disabled')) : '';
                optHtml += `<div class="option-line ${s}" onclick="selectOption(${q.id},'${k}','${q.answer}')"><b>${k}.</b> ${q.options[k]}</div>`;
            });
            qHtml += `<div class="question-item" id="cau-${q.id}" data-id="${q.id}" data-raw-q="${q.question}" data-raw-note="${q.note||''}">
                <div class="question-header"><span class="q-id-text">#${q.id}</span> <span class="q-text-body">${q.question}</span></div>
                <div class="options-list">${optHtml}</div>
                <div class="note-box" id="note-${q.id}" style="${res?'display:block':''}">💡 <b>Ghi chú:</b> <span class="note-text-body">${q.note||"Đáp án chính xác."}</span></div>
            </div>`;
        });
        navGrid.innerHTML = navHtml; qContainer.innerHTML = qHtml;
        updateScoreBoard();
        applyFilters();
    }

    function selectOption(id, sel, ans) {
        if (userProgress[id]) return;
        userProgress[id] = { selected: sel, isCorrect: (sel === ans) };
        localStorage.setItem('user_exam_progress_d', JSON.stringify(userProgress));
        location.reload(); 
    }

    function applyFilters() {
        const input = document.getElementById('search-input').value.trim();
        const hideCorrect = document.getElementById('hide-correct-toggle').checked;
        const inputNorm = removeAccents(input);

        let highlightRegex = null;
        try { if(input.length >= 1) highlightRegex = getRegexForHighlight(input); } catch(e) {}

        sortedData.forEach(q => {
            const res = userProgress[q.id];
            const qEl = document.getElementById(`cau-${q.id}`);
            const navEl = document.getElementById(`nav-${q.id}`);
            const qTextBody = qEl.querySelector('.q-text-body');
            const noteTextBody = qEl.querySelector('.note-text-body');
            const rawQ = qEl.getAttribute('data-raw-q');
            const rawNote = qEl.getAttribute('data-raw-note') || "Đáp án chuẩn xác.";

            // Kiểm tra khớp bằng bản không dấu
            const searchable = removeAccents(q.id + " " + rawQ + " " + rawNote);
            
            let isMatch = true;
            if (input !== "") {
                // Nếu input có ký hiệu Regex đặc biệt, dùng highlightRegex để test
                if (/[\^$|\\*+?()]/.test(input) && highlightRegex) {
                    isMatch = highlightRegex.test(rawQ) || highlightRegex.test(rawNote) || highlightRegex.test(q.id.toString());
                    highlightRegex.lastIndex = 0;
                } else {
                    isMatch = searchable.includes(inputNorm);
                }
            }

            const shouldHide = hideCorrect && res && res.isCorrect;

            if (isMatch && !shouldHide) {
                qEl.classList.remove('hidden-force'); navEl.classList.remove('hidden-force');
                qEl.style.opacity = "1";
                if (highlightRegex && input.length >= 1) {
                    // Cơ chế Highlight bảo vệ: Chỉ bọc mark khi có nội dung khớp thực tế
                    qTextBody.innerHTML = rawQ.replace(highlightRegex, (match, group) => group ? `<mark>${group}</mark>` : match);
                    noteTextBody.innerHTML = rawNote.replace(highlightRegex, (match, group) => group ? `<mark>${group}</mark>` : match);
                } else {
                    qTextBody.innerText = rawQ; noteTextBody.innerText = rawNote;
                }
            } else {
                qEl.classList.add('hidden-force'); navEl.classList.add('hidden-force');
            }
        });
    }

    function resetWrongOnly() {
        let count = 0; const newProg = {};
        for (const [id, data] of Object.entries(userProgress)) { if (data.isCorrect) newProg[id] = data; else count++; }
        if (count === 0) return alert("Không có câu sai!");
        if (confirm(`Làm lại ${count} câu SAI?`)) { userProgress = newProg; localStorage.setItem('user_exam_progress_d', JSON.stringify(userProgress)); location.reload(); }
    }

    function resetAll() { if (confirm("Xóa SẠCH kết quả?")) { localStorage.removeItem('user_exam_progress_d'); location.reload(); } }

    function updateScoreBoard() {
        const att = Object.keys(userProgress).length;
        const cor = Object.values(userProgress).filter(v => v.isCorrect).length;
        document.getElementById('score-display').innerHTML = `${cor} / ${att}`;
        const pct = Math.round((att / sortedData.length) * 100) || 0;
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('perc').innerText = pct + '%';
    }

    function handleNavClick() { if (window.innerWidth <= 600) toggleSidebar(); }
    window.onload = init;
</script>
</body>
</html>
