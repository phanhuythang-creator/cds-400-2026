<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách 400 Câu - Menu Thông Minh</title>
    <script src="data.js"></script>
    <style>
        :root { --primary: #2563eb; --success: #166534; --bg: #f1f5f9; --text: #1e293b; --sidebar-w: 260px; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* NÚT ĐIỀU KHIỂN MENU */
        .toggle-btn { position: fixed; top: 15px; left: 15px; z-index: 1000; background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-size: 1.2rem; }

        /* MENU BÊN TRÁI (SIDEBAR) */
        .sidebar { width: var(--sidebar-w); background: white; border-right: 2px solid #e2e8f0; display: flex; flex-direction: column; padding: 70px 15px 15px 15px; transition: all 0.3s ease; position: relative; }
        .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w) - 30px); }
        
        .sidebar-header { font-weight: 800; font-size: 1.1rem; color: var(--primary); margin-bottom: 15px; text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; overflow-y: auto; flex: 1; padding-right: 5px; }
        .nav-item { display: flex; align-items: center; justify-content: center; height: 35px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; text-decoration: none; color: #64748b; font-size: 0.8rem; font-weight: 600; transition: 0.2s; }
        .nav-item:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* NỘI DUNG BÊN PHẢI */
        .main-content { flex: 1; overflow-y: auto; padding: 20px 30px; background: #fff; scroll-behavior: smooth; transition: all 0.3s ease; }
        .page-title { text-align: center; color: var(--primary); margin: 40px 0 20px 0; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 10px; width: 100%; }
        
        .question-item { border-bottom: 1px solid #f1f5f9; padding: 30px 0; scroll-margin-top: 80px; }
        .question-header { font-weight: 700; font-size: 1.15rem; margin-bottom: 15px; color: #0f172a; }
        .q-id-text { color: var(--primary); margin-right: 5px; }
        
        .options-list { padding-left: 10px; }
        .option-line { padding: 8px 12px; border-radius: 6px; margin: 4px 0; border: 1px solid transparent; }
        .is-correct { background-color: #dcfce7; color: var(--success); font-weight: 600; border: 1px solid #22c55e; }
        
        .note-box { background: #fefce8; border-left: 4px solid #facc15; padding: 15px; margin-top: 15px; font-size: 0.95rem; font-style: italic; color: #854d0e; border-radius: 4px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @media print {
            .sidebar, .toggle-btn { display: none !important; }
            .main-content { overflow: visible; padding: 0; }
            .question-item { page-break-inside: avoid; }
        }

        /* Mobile tối ưu */
        @media (max-width: 600px) {
            .sidebar { position: fixed; z-index: 999; height: 100%; }
            .sidebar.collapsed { margin-left: -300px; }
        }
    </style>
</head>
<body>

    <button class="toggle-btn" onclick="toggleSidebar()" title="Ẩn/Hiện Mục Lục">☰</button>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">MỤC LỤC 1-400</div>
        <div class="nav-grid" id="nav-grid"></div>
    </div>

    <div class="main-content" id="main-content">
        <div style="text-align:center"><h1 class="page-title">TỔNG HỢP 400 CÂU HỎI ÔN TẬP</h1></div>
        <div id="questions-container"></div>
    </div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
    }

    function init() {
        const navGrid = document.getElementById('nav-grid');
        const qContainer = document.getElementById('questions-container');
        const sortedData = [...questionsData].sort((a, b) => a.id - b.id);
        
        let navHtml = '';
        let qHtml = '';

        sortedData.forEach((q) => {
            navHtml += `<a href="#cau-${q.id}" class="nav-item" onclick="handleNavClick()">${q.id}</a>`;

            let optHtml = '';
            Object.keys(q.options).forEach(key => {
                const ok = (key === q.answer);
                optHtml += `
                    <div class="option-line ${ok ? 'is-correct' : ''}">
                        <b>${key}.</b> ${q.options[key]} ${ok ? ' ✓' : ''}
                    </div>`;
            });

            qHtml += `
                <div class="question-item" id="cau-${q.id}">
                    <div class="question-header">
                        <span class="q-id-text">Câu ${q.id}:</span> ${q.question}
                    </div>
                    <div class="options-list">${optHtml}</div>
                    ${q.note ? `<div class="note-box">💡 <b>Ghi chú:</b> ${q.note}</div>` : ''}
                </div>
            `;
        });

        navGrid.innerHTML = navHtml;
        qContainer.innerHTML = qHtml;
    }

    // Tự động đóng menu khi chọn câu trên mobile
    function handleNavClick() {
        if (window.innerWidth <= 600) {
            toggleSidebar();
        }
    }

    window.onload = init;
</script>

</body>
</html>
